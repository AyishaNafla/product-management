<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Product Management{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #212529;
        }

        .sidebar .brand {
            font-size: 22px;
            font-weight: bold;
            color: white;
            padding: 20px;
            display: block;
            text-decoration: none;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background-color: #343a40;
            color: white;
        }

        .main-content {
            padding: 30px;
        }

        .stat-card {
            border: none;
            border-radius: 12px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 sidebar px-0">

                <a href="/" class="brand">
                    Product Manager
                </a>

                <a href="/">Dashboard</a>
                <a href="/products/">Products</a>
                <a href="/categories/">Categories</a>
                <a href="/inventory/">Inventory</a>
                <a href="/sales/">Sales</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10">

                <div class="main-content">

                    {% block content %}
                    {% endblock %}

                </div>

            </div>

        </div>
    </div>

</body>

</html>
