{% extends 'base.html' %}

{% block title %}
Edit Product - Product Management
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h1>Edit Product</h1>
        <p class="text-muted">
            Update product information.
        </p>
    </div>

    <a href="/products/" class="btn btn-secondary">
        ← Back to Products
    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Product Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ product.name }}"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                >{{ product.description }}</textarea>
            </div>


            <div class="mb-3">
                <label class="form-label">Price</label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    value="{{ product.price }}"
                    step="0.01"
                    required
                >
            </div>


            <div class="mb-3">
                <label class="form-label">Stock</label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    value="{{ product.stock }}"
                    min="0"
                    required
                >
            </div>


            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="/products/" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
